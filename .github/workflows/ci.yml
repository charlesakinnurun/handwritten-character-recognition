name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU torch + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests scripts app
      - name: Ruff format check
        run: ruff format --check src tests scripts app
      - name: MyPy
        run: mypy src
      - name: Validate shipped configs
        run: |
          python - <<'PY'
          from handwriting_intelligence.config import load_config
          for name in ("configs/mnist_cnn.yaml", "configs/mnist_cnn_improved.yaml", "configs/emnist_cnn.yaml"):
              load_config(name)
          print("configs OK")
          PY

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU torch + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -e ".[dev]"
      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Model forward-pass smoke test
        run: |
          python - <<'PY'
          import torch
          from handwriting_intelligence.models import build_model, available_models
          from handwriting_intelligence.config import ModelConfig
          for name in available_models():
              model = build_model(ModelConfig(name=name, channels=[8, 16], hidden_dim=16), 10)
              out = model(torch.zeros(2, 1, 28, 28))
              assert out.shape == (2, 10), (name, out.shape)
          print("forward pass OK")
          PY
      - name: API import & startup smoke test
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from handwriting_intelligence.api.main import create_app
          from handwriting_intelligence.api.dependencies import Settings
          app = create_app(Settings(artifact_path="does/not/exist.pt", log_format="text"))
          with TestClient(app) as client:
              assert client.get("/health").status_code == 200
              assert client.get("/ready").status_code == 503
          print("API smoke OK")
          PY

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t handwriting-intelligence:ci .
