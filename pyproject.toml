[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "handwriting-intelligence"
version = "0.1.0"
description = "Production-grade handwritten character recognition: CNN/CRNN pipelines, evaluation, FastAPI serving, and an interactive demo."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Charles Akinnurun" }]
keywords = ["machine-learning", "computer-vision", "pytorch", "ocr", "mnist", "emnist", "cnn", "crnn"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "pillow>=10.0",
    "PyYAML>=6.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "scikit-learn>=1.4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "streamlit>=1.32",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
opencv = ["opencv-python-headless>=4.9"]
demo = ["streamlit-drawable-canvas>=0.9"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
hi-download-data = "handwriting_intelligence.cli.download:main"
hi-train = "handwriting_intelligence.cli.train:main"
hi-evaluate = "handwriting_intelligence.cli.evaluate:main"
hi-predict = "handwriting_intelligence.cli.predict:main"
hi-serve = "handwriting_intelligence.cli.serve:main"

[project.urls]
Homepage = "https://github.com/charlesakinnurun/handwritten-character-recognition"
Issues = "https://github.com/charlesakinnurun/handwritten-character-recognition/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
handwriting_intelligence = ["py.typed"]

# ---------------------------------------------------------------------------
# Tooling configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "integration: tests that exercise multiple components together",
    "smoke: fast import / startup checks",
    "slow: tests that are slower than the routine unit suite",
    "dataset: tests that require a real dataset on disk (opt-in)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["handwriting_intelligence"]
branch = true
omit = ["*/cli/*", "*/__main__.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line length handled by the formatter
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "RUF012", # mutable class attrs are fine for torch modules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"notebooks/**" = ["E402", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["handwriting_intelligence"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["notebooks/", "build/", "dist/"]

[[tool.mypy.overrides]]
module = ["torch.*", "torchvision.*", "sklearn.*", "matplotlib.*", "streamlit.*", "cv2.*"]
ignore_missing_imports = true
